[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [".scratch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
farseer-core = { path = "crates/farseer-core" }
farseer-store = { path = "crates/farseer-store" }
farseer-api = { path = "crates/farseer-api" }
farseer-runner = { path = "crates/farseer-runner" }

anyhow = "1.0.100"
axum = "0.8.6"
clap = { version = "4.5.51", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
