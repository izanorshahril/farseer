[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [".scratch"]
# `cargo run` opens the desktop shell, because that is what running farseer
# means: `28 operator surface` chose Tauri and demoted `farseer serve` to
# optional - the shell attaches to a running daemon or starts one itself. A bare
# `cargo run` used to pick the `farseer` binary, which has no default subcommand
# and exits 2 on its usage text, so the first thing a new checkout did was fail.
# `cargo build` and `cargo test` follow this too, so both cover the shell alone.
# Use `--workspace` for either, which is what CI and `AGENTS.md` say.
default-members = ["crates/farseer-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
farseer-core = { path = "crates/farseer-core" }
farseer-store = { path = "crates/farseer-store" }
farseer-api = { path = "crates/farseer-api" }
farseer-runner = { path = "crates/farseer-runner" }
farseer-manager = { path = "crates/farseer-manager" }
farseer-shell = { path = "crates/farseer-shell" }

anyhow = "1.0.100"
axum = "0.8.6"
clap = { version = "4.5.51", features = ["derive"] }
rmcp = { version = "=3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "=1.2.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream"] }
tauri = { version = "2.9.1", features = ["tray-icon"] }
thiserror = "2.0.17"
tower-http = { version = "0.6.7", features = ["fs"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
