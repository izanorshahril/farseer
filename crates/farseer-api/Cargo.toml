[package]
name = "farseer-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Farseer's local API: bespoke HTTP plus SSE on 127.0.0.1, per ticket 16."

[dependencies]
farseer-core.workspace = true
farseer-store.workspace = true
farseer-runner.workspace = true
farseer-manager.workspace = true

axum = "0.8.6"
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = "0.1.17"
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
http-body-util = "0.1.3"
reqwest = "0.13.4"
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
